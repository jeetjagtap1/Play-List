<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PlayList logo">
  <defs>
    <linearGradient id="pl-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcb52"/>
      <stop offset="1" stop-color="#ff8a1f"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#pl-tile)"/>
  <g fill="#1a1200">
    <!-- the P's stem -->
    <rect x="15" y="13" width="8.5" height="38" rx="4.25"/>
    <!-- the P's bowl: a rounded play button -->
    <path d="M27.5 15.2v15.6a2.5 2.5 0 0 0 3.8 2.1l12.4-7.8a2.5 2.5 0 0 0 0-4.2L31.3 13.1A2.5 2.5 0 0 0 27.5 15.2z"/>
    <!-- list rows tucked under the bowl -->
